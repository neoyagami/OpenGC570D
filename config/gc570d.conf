# Configuration file for the AVerMedia Live Gamer DUO GC570D driver
#
# HDMI IN 1 Hotplug Policy:
#   preserve    - (Default) Prioritizes uninterrupted capture on HDMI IN 1.
#                 Publishes the internal 4K60 bridge EDID at startup so HDMI IN 1
#                 works standalone without an external HDMI OUT monitor.
#                 Connecting an HDMI OUT monitor enables passthrough on the fly
#                 using the existing negotiated mode without pulsing upstream HPD
#                 or interrupting active capture. Downstream EDID is read only to
#                 report compatibility. Disconnecting HDMI OUT does not pulse HPD
#                 or interrupt capture.
#
#   renegotiate - Prioritizes downstream monitor compatibility.
#                 If an HDMI OUT monitor is connected at startup, its EDID is read
#                 and published before upstream HPD is asserted for the first time.
#                 If no monitor is connected, internal EDID is published for standalone capture.
#                 Connecting a monitor later reads its EDID, publishes it, and triggers
#                 a deliberate upstream HPD pulse to renegotiate. Disconnecting HDMI OUT
#                 maintains current capture without renegotiation.
#
HDMI1_HOTPLUG_POLICY="preserve"
