# SPDX-License-Identifier: GPL-2.0-only
name: Build kernel module

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fedora-44:
    name: Fedora 44 / distribution toolchain
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - name: Install build dependencies
        run: |
          dnf -y --setopt=install_weak_deps=False install \
            binutils elfutils-libelf-devel findutils gcc git \
            kernel-devel kmod make

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run repository checks
        run: make check

      - name: Build external module
        run: |
          generated_hash=$(sha256sum data/gc570d_no_signal_640x360.inc | cut -d ' ' -f 1)
          kernel_release=$(rpm -q --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n' kernel-devel | sort -V | tail -n 1)
          kernel_build="/usr/src/kernels/$kernel_release"
          test -d "$kernel_build"
          make -j"$(nproc)" KERNEL_RELEASE="$kernel_release" KDIR="$kernel_build"
          modinfo ./gc570d.ko
          strings ./gc570d.ko | grep -qx 'dma_stress'
          test "$generated_hash" = "$(sha256sum data/gc570d_no_signal_640x360.inc | cut -d ' ' -f 1)"

          make clean KERNEL_RELEASE="$kernel_release" KDIR="$kernel_build"
          make -j"$(nproc)" GC570D_DEVELOPER_DEBUGFS=0 \
            KERNEL_RELEASE="$kernel_release" KDIR="$kernel_build"
          if strings ./gc570d.ko | grep -Eq \
            '^(dma_stress|splitter_core_preamble|it68051_init)$'; then
            echo 'distribution module still exposes developer debugfs names' >&2
            exit 1
          fi
          modinfo ./gc570d.ko
          test "$generated_hash" = "$(sha256sum data/gc570d_no_signal_640x360.inc | cut -d ' ' -f 1)"

  fedora-44-akmod:
    name: Fedora 44 / RPM and AKMOD packaging
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - name: Install packaging dependencies
        run: |
          dnf -y --setopt=install_weak_deps=False install \
            akmods findutils git glibc-langpack-en kernel-core kernel-devel \
            kmod kmodtool rpm-build rpmdevtools rpmlint

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and lint RPM packages
        run: |
          export LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8
          rpm_topdir="$PWD/rpmbuild"
          mkdir -p "$rpm_topdir"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp packaging/fedora/*.spec "$rpm_topdir/SPECS/"
          version=$(sed -n 's/^Version:[[:space:]]*//p' \
            "$rpm_topdir/SPECS/gc570d-kmod.spec" | sed -n '1p')
          if [ "$GITHUB_REF" = "refs/tags/v$version" ]; then
            spectool -g -C "$rpm_topdir/SOURCES" \
              "$rpm_topdir/SPECS/gc570d-kmod.spec"
          else
            git archive --format=tar.gz --prefix="OpenGC570D-$version/" \
              --output="$rpm_topdir/SOURCES/OpenGC570D-$version.tar.gz" HEAD
          fi
          rpmbuild --define "_topdir $rpm_topdir" -ba \
            "$rpm_topdir/SPECS/gc570d-kmod.spec"
          rpmbuild --define "_topdir $rpm_topdir" -ba \
            "$rpm_topdir/SPECS/gc570d.spec"
          rpmlint -r packaging/fedora/gc570d.rpmlintrc \
            "$rpm_topdir"/SPECS/*.spec \
            "$rpm_topdir"/RPMS/*/*.rpm \
            "$rpm_topdir"/SRPMS/*.rpm

      - name: Rebuild the module through AKMOD
        run: |
          rpm_topdir="$PWD/rpmbuild"
          rpm -Uvh --nodeps --noscripts \
            "$rpm_topdir"/RPMS/noarch/gc570d-*.rpm \
            "$rpm_topdir"/RPMS/x86_64/akmod-gc570d-*.rpm
          kernel_release=$(rpm -q --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n' \
            kernel-core | sort -V | tail -n 1)
          akmods --force --kernels "$kernel_release" --kmod gc570d
          module=$(find "/usr/lib/modules/$kernel_release/extra" \
            -type f -name 'gc570d.ko*' -print -quit)
          test -n "$module"
          modinfo "$module"
